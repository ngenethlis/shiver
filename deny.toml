# cargo-deny: dependency licenses, security advisories and sources.
# Run locally with `cargo deny check`.

[graph]
all-features = false
# shiver only targets Linux; skip Windows/macOS-only dependencies.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Fail on vulnerabilities, unmaintained crates and yanked versions.
yanked = "deny"
ignore = []

[licenses]
# Licenses our dependencies use, all compatible with `MIT OR Apache-2.0`.
# Add to this list only after checking a new license is permissive.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  # File-level copyleft; fine for unmodified dependencies (option-ext, via dirs).
  "MPL-2.0",
]
confidence-threshold = 0.9
# Our own unpublished crates (xtask) don't need checking.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
